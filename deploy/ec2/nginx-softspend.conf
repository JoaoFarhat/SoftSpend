server {
    listen 80;
    listen [::]:80;
    server_name softspend.com.br www.softspend.com.br;

    # Renovacao do certificado precisa continuar acessivel via HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo trafego HTTP para HTTPS, preservando URI e query string.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name softspend.com.br www.softspend.com.br;

    ssl_certificate /etc/letsencrypt/live/softspend.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softspend.com.br/privkey.pem;

    # Parametros TLS declarados inline de proposito: os arquivos
    # options-ssl-nginx.conf e ssl-dhparams.pem so sao criados quando o certbot
    # roda com o plugin --nginx. Com `certonly --webroot` eles nao existem, e um
    # `include` de arquivo ausente derruba o `nginx -t`.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: 1 ano, inclui subdominios. So adiciona esse header em respostas
    # HTTPS; o redirecionamento 301 em si ja indica para nao repetir HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Uploads de nota fiscal chegam a ~9MB antes do multipart; o default do
    # nginx (1M) rejeitaria com 413.
    client_max_body_size 20M;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
    }
}
