name: CI/CD to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-32-characters-minimum
      REFRESH_TOKEN_SECRET_KEY: ci-only-refresh-secret-32-chars-diff
    defaults:
      run:
        working-directory: ./Python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Smoke test import
        run: python -c "import main; print('routes:', len(main.app.routes))"

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/SoftSpend
            # .env é gitignored; git reset --hard não o toca, então não
            # precisamos fazer backup em /tmp (que é legível por todos).
            git fetch origin
            git reset --hard origin/main

            # Garante dependencias de build do Pillow (especialmente em Python 3.14)
            sudo apt-get update
            sudo apt-get install -y \
              python3-venv python3-pil \
              libjpeg-dev libpng-dev libwebp-dev libtiff-dev zlib1g-dev

            cd Python

            # Se a venv nao existe, cria com acesso a pacotes do sistema.
            # Isso permite usar o python3-pil do sistema se Pillow nao compilar.
            if [ ! -d .venv ]; then
              python3 -m venv .venv --system-site-packages
            fi

            # Se a venv existente nao consegue importar Pillow (ex: Python 3.14
            # sem wheel oficial), recria-la com acesso aos pacotes do sistema.
            # O python3-pil instalado via apt sera usado, evitando compilacao.
            if [ -d .venv ] && ! .venv/bin/python -c "import PIL" 2>/dev/null; then
              rm -rf .venv
            fi

            if [ ! -d .venv ]; then
              python3 -m venv .venv --system-site-packages
            fi

            source .venv/bin/activate
            pip install --upgrade pip

            # Pillow 10.x nao compila em Python 3.14. A venv usa
            # --system-site-packages para acessar o python3-pil do sistema
            # caso nao haja wheel do Pillow 11.x para a plataforma.
            pip install -r requirements.txt
            alembic upgrade head
            sudo systemctl restart softspend
            # Health check com retry antes de declarar sucesso
            for i in {1..10}; do
              if curl -fsS http://localhost:8000/health; then
                echo "Health check OK"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "Health check falhou após 10 tentativas"
                exit 1
              fi
              sleep 2
            done
