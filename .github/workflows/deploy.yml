name: CI/CD to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-32-characters-minimum
      REFRESH_TOKEN_SECRET_KEY: ci-only-refresh-secret-32-chars-diff
    defaults:
      run:
        working-directory: ./Python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Smoke test import
        run: python -c "import main; print('routes:', len(main.app.routes))"

      - name: Run tests
        run: python3 -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://softspend.com.br/health
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/SoftSpend

            # Health check com retry: devolve 0 se a API respondeu em ate 10
            # tentativas, 1 se nao. Sem "exit" aqui dentro: quem decide o
            # destino do deploy e o chamador.
            checar_saude() {
              for i in {1..10}; do
                if curl -fsS http://127.0.0.1:8000/health; then
                  echo "Health check OK"
                  return 0
                fi
                if [ "$i" -eq 10 ]; then
                  echo "Health check falhou após 10 tentativas"
                  return 1
                fi
                sleep 2
              done
            }

            # .env é gitignored; git reset --hard não o toca, então não
            # precisamos fazer backup em /tmp (que é legível por todos).
            # ANTES guarda o commit que esta rodando, para o rollback.
            ANTES="$(git rev-parse HEAD)"
            git fetch origin
            git reset --hard origin/main

            # Publica as paginas estaticas (/termos, /privacidade, /suporte) que
            # o nginx serve direto de /var/www/softspend. Arquivo estatico nao
            # precisa recarregar o nginx.
            sudo mkdir -p /var/www/softspend
            sudo cp deploy/site/*.html /var/www/softspend/

            # Garante dependencias de build do Pillow (especialmente em Python 3.14).
            # Só roda apt-get quando falta algum dos pacotes.
            dpkg -s \
              python3-venv python3-pil \
              libjpeg-dev libpng-dev libwebp-dev libtiff-dev zlib1g-dev \
              >/dev/null 2>&1 || {
              sudo apt-get update
              sudo apt-get install -y \
                python3-venv python3-pil \
                libjpeg-dev libpng-dev libwebp-dev libtiff-dev zlib1g-dev
            }

            cd Python

            # Se a venv nao existe, cria com acesso a pacotes do sistema.
            # Isso permite usar o python3-pil do sistema se Pillow nao compilar.
            if [ ! -d .venv ]; then
              python3 -m venv .venv --system-site-packages
            fi

            # Se a venv existente nao consegue importar Pillow (ex: Python 3.14
            # sem wheel oficial), recria-la com acesso aos pacotes do sistema.
            # O python3-pil instalado via apt sera usado, evitando compilacao.
            if [ -d .venv ] && ! .venv/bin/python -c "import PIL" 2>/dev/null; then
              rm -rf .venv
            fi

            if [ ! -d .venv ]; then
              python3 -m venv .venv --system-site-packages
            fi

            source .venv/bin/activate
            pip install --upgrade pip

            # Pillow 10.x nao compila em Python 3.14. A venv usa
            # --system-site-packages para acessar o python3-pil do sistema
            # caso nao haja wheel do Pillow 11.x para a plataforma.
            pip install -r requirements.txt

            # Com migration pendente (current != heads), faz backup antes de
            # migrar. O softspend-backup.service é oneshot: o start espera
            # terminar e, se falhar, o set -e para o deploy antes da migration.
            ATUAL="$(alembic -c alembic/alembic.ini current 2>/dev/null | awk '{print $1}')"
            NOVO="$(alembic -c alembic/alembic.ini heads | awk '{print $1}')"
            MIGROU=""
            if [ "$ATUAL" != "$NOVO" ]; then
              MIGROU=1
              if systemctl cat softspend-backup.service >/dev/null 2>&1; then
                sudo systemctl start softspend-backup.service
              else
                echo "backup não instalado, migration sem cópia"
              fi
            fi
            alembic -c alembic/alembic.ini upgrade head
            sudo systemctl restart softspend

            # Se a API nova nao sobe, mostra o log do servico e desfaz o
            # deploy voltando ao commit que rodava antes — menos quando houve
            # migration, porque o banco ja esta no schema novo. Nos dois
            # casos o job sai vermelho.
            if ! checar_saude; then
              sudo journalctl -u softspend -n 50 --no-pager || true
              if [ -z "$MIGROU" ]; then
                git reset --hard "$ANTES"
                pip install -r requirements.txt
                sudo systemctl restart softspend
                if checar_saude; then
                  echo "deploy desfeito: voltou para $ANTES"
                else
                  echo "a volta também falhou"
                fi
              else
                echo "health check falhou depois de migration; código não foi desfeito, conferir na EC2"
              fi
              exit 1
            fi
