name: App iOS

# Compila o app e roda os testes no simulador a cada PR que mexe no app.
# O repositório é público, então os minutos de Mac do GitHub não são cobrados.
on:
  pull_request:
    branches: [main]
    paths: ["SoftexVamo/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["SoftexVamo/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ./SoftexVamo
    steps:
      - uses: actions/checkout@v4

      # O projeto pede iOS 26 (Xcode 26): usa o Xcode 26 mais novo da máquina.
      - name: Escolher o Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # O Config.xcconfig fica fora do Git; o exemplo basta para compilar e testar.
      - name: Configuração
        run: cp SoftexVamo/Config.example.xcconfig SoftexVamo/Config.xcconfig

      - name: Escolher o simulador
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ids = [x["udid"] for r, xs in sorted(d.items(), reverse=True) if "iOS-26" in r
                 for x in xs if x["name"].startswith("iPhone")]
          print(ids[0])')
          echo "SIMULADOR=$ID" >> "$GITHUB_ENV"

      # Assinatura local ("-"), sem conta da Apple: sem nenhuma assinatura o simulador
      # não dá o Keychain ao app, e os testes do comprovante cifrado falham.
      - name: Compilar e testar
        run: |
          xcodebuild test \
            -project SoftSpend.xcodeproj -scheme SoftSpend \
            -destination "id=$SIMULADOR" \
            -configuration Debug             CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
